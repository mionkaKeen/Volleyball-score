<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supabase Integration</title>

  <!-- Load Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Supabase Connection Test</h1>
  <div id="output">Loading data...</div>

  <script>
    // Project Credentials
    const SUPABASE_URL = 'https://cesffaiaxrwoomuttlza.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_QOFPHVDAgI2dNr977BREvw_ga_HMzuE';

    // Initialize the Client
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Test function to pull rows from your database
    async function getTableData() {
      // Replace 'your_table_name' with the actual table name you created in Supabase
      const { data, error } = await supabaseClient
        .from('your_table_name') 
        .select('*');

      const outputDiv = document.getElementById('output');

      if (error) {
        console.error('Supabase Error:', error);
        outputDiv.innerText = 'Error: ' + error.message;
        return;
      }

      console.log('Fetched Data:', data);
      outputDiv.innerText = JSON.stringify(data, null, 2);
    }

    getTableData();
  </script>
</body>
</html>
